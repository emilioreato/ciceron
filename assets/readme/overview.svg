<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Cicerón, tu centro de escritorio</title>
  <desc id="desc">Ilustración conceptual de la biblioteca de Cicerón junto a una barra lateral de vidrio y una burbuja de Liquid Glass.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f4f0e8"/><stop offset="1" stop-color="#ded8ce"/></linearGradient>
    <linearGradient id="window" x2="0.9" y2="1"><stop stop-color="#272624"/><stop offset="1" stop-color="#171716"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".48"/><stop offset=".5" stop-color="#ded8ce" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".38"/></linearGradient>
    <linearGradient id="orb" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".72"/><stop offset=".45" stop-color="#dfcbb5" stop-opacity=".25"/><stop offset="1" stop-color="#bb755b" stop-opacity=".54"/></linearGradient>
    <linearGradient id="warm" x2="1"><stop stop-color="#d38a6c"/><stop offset="1" stop-color="#e3b17d"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur in="SourceAlpha" stdDeviation="20"/><feOffset dy="18"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="23"/></filter>
    <clipPath id="screen"><rect x="66" y="202" width="1022" height="500" rx="28"/></clipPath>
    <clipPath id="lens"><circle cx="1208" cy="603" r="88"/></clipPath>
  </defs>
  <rect width="1440" height="800" rx="34" fill="url(#paper)"/>
  <circle cx="1260" cy="120" r="190" fill="#fff" opacity=".4" filter="url(#soft)"/>
  <circle cx="105" cy="760" r="160" fill="#d4ad91" opacity=".23" filter="url(#soft)"/>
  <text x="78" y="78" fill="#9d624d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">CICERÓN · CENTRO DE CONTROL</text>
  <text x="78" y="132" fill="#252321" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="650">Tus herramientas, a un gesto.</text>
  <text x="80" y="166" fill="#6e6860" font-family="Segoe UI,Arial,sans-serif" font-size="17">La biblioteca vive en la barra. El escritorio sigue siendo tuyo.</text>

  <g filter="url(#shadow)">
    <rect x="66" y="202" width="1022" height="500" rx="28" fill="url(#window)" stroke="#fff" stroke-opacity=".52" stroke-width="1.5"/>
    <g clip-path="url(#screen)">
      <rect x="66" y="202" width="1022" height="64" fill="#302e2c"/>
      <circle cx="99" cy="234" r="6" fill="#e49179"/><circle cx="120" cy="234" r="6" fill="#d7b172"/><circle cx="141" cy="234" r="6" fill="#a8b29a"/>
      <text x="177" y="240" fill="#f0ece6" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">Cicerón</text>
      <text x="999" y="240" fill="#aaa49c" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="end">MI CENTRO</text>
      <text x="112" y="323" fill="#f7f3ed" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600">Mis aplicaciones</text>
      <text x="112" y="352" fill="#aaa49c" font-family="Segoe UI,Arial,sans-serif" font-size="15">Lo que usas, organizado en un solo lugar.</text>
      <rect x="112" y="385" width="282" height="191" rx="20" fill="#353330" stroke="#fff" stroke-opacity=".1"/>
      <rect x="134" y="408" width="48" height="48" rx="15" fill="url(#warm)"/>
      <path d="M146 439c5-13 19-13 24 0M150 426h16" fill="none" stroke="#fff8f0" stroke-width="2.5" stroke-linecap="round"/>
      <text x="134" y="492" fill="#f4f0e9" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Happy Verde</text>
      <text x="134" y="520" fill="#bdb6ad" font-family="Segoe UI,Arial,sans-serif" font-size="14">Agenda personal</text>
      <rect x="134" y="542" width="102" height="25" rx="12" fill="#4c4843"/><text x="185" y="559" fill="#e8ded2" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">ABRIR</text>
      <rect x="418" y="385" width="282" height="191" rx="20" fill="#353330" stroke="#fff" stroke-opacity=".1"/>
      <rect x="440" y="408" width="48" height="48" rx="15" fill="#67635d"/>
      <circle cx="464" cy="432" r="14" fill="none" stroke="#f3eee7" stroke-width="2"/><path d="M464 422v10l7 4" fill="none" stroke="#f3eee7" stroke-width="2" stroke-linecap="round"/>
      <text x="440" y="492" fill="#f4f0e9" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Timer</text>
      <text x="440" y="520" fill="#bdb6ad" font-family="Segoe UI,Arial,sans-serif" font-size="14">Tiempo para enfocarte</text>
      <rect x="440" y="542" width="102" height="25" rx="12" fill="#4c4843"/><text x="491" y="559" fill="#e8ded2" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">ABRIR</text>
      <rect x="724" y="385" width="282" height="191" rx="20" fill="#353330" stroke="#fff" stroke-opacity=".1"/>
      <rect x="746" y="408" width="48" height="48" rx="15" fill="#77736b"/>
      <circle cx="770" cy="432" r="13" fill="none" stroke="#f3eee7" stroke-width="2"/><path d="M757 432h26M770 419c6 7 6 19 0 26M770 419c-6 7-6 19 0 26" fill="none" stroke="#f3eee7" stroke-width="1.5"/>
      <text x="746" y="492" fill="#f4f0e9" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Navegador</text>
      <text x="746" y="520" fill="#bdb6ad" font-family="Segoe UI,Arial,sans-serif" font-size="14">Pausa Feed</text>
      <rect x="746" y="542" width="102" height="25" rx="12" fill="#4c4843"/><text x="797" y="559" fill="#e8ded2" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">ABRIR</text>
      <text x="112" y="638" fill="#a69f96" font-family="Segoe UI,Arial,sans-serif" font-size="13">APPS · ACCESOS · HERRAMIENTAS</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1120" y="236" width="96" height="354" rx="42" fill="url(#glass)" stroke="#fff" stroke-opacity=".78" stroke-width="2"/>
    <circle cx="1168" cy="285" r="23" fill="#ffffff" fill-opacity=".18" stroke="#fff" stroke-opacity=".55"/>
    <circle cx="1168" cy="285" r="11" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M1168 278v8l5 3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="1168" cy="371" r="23" fill="#ffffff" fill-opacity=".15" stroke="#fff" stroke-opacity=".5"/>
    <circle cx="1168" cy="371" r="12" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M1156 371h24M1168 359c6 6 6 18 0 24M1168 359c-6 6-6 18 0 24" fill="none" stroke="#fff" stroke-width="1.3"/>
    <circle cx="1168" cy="457" r="23" fill="#ffffff" fill-opacity=".15" stroke="#fff" stroke-opacity=".5"/>
    <path d="M1159 457h18M1168 448v18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1168" cy="543" r="23" fill="#ffffff" fill-opacity=".15" stroke="#fff" stroke-opacity=".5"/>
    <path d="M1168 531l3 4 5-1 1 5 4 3-3 4 1 5-5 1-3 4-4-3-5 1-1-5-4-3 3-4-1-5 5-1z" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="1168" cy="547" r="4" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M1224 410h24" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/><path d="M1241 403l8 7-8 7" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1168" y="622" fill="#59534c" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">BARRA LATERAL</text>

  <g filter="url(#shadow)">
    <circle cx="1208" cy="697" r="88" fill="url(#orb)" stroke="#fff" stroke-opacity=".9" stroke-width="2"/>
    <g clip-path="url(#lens)">
      <rect x="1117" y="606" width="182" height="182" fill="#e9e2d8"/>
      <path d="M1106 738l170-122M1105 765l185-133M1122 794l180-129" stroke="#a96c56" stroke-opacity=".55" stroke-width="18"/>
      <circle cx="1210" cy="695" r="48" fill="#fff" fill-opacity=".16" filter="url(#soft)"/>
      <path d="M1141 673c25-46 106-62 140-22" fill="none" stroke="#fff" stroke-opacity=".88" stroke-width="4" stroke-linecap="round"/>
      <path d="M1140 714c36 40 99 45 136 9" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="2"/>
    </g>
    <circle cx="1208" cy="697" r="88" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>
  </g>
  <text x="1298" y="706" fill="#6d6258" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">LENTE GPU</text>
</svg>
