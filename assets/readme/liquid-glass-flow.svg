<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">La burbuja de Cicerón, paso a paso</title>
  <desc id="desc">Tres viñetas ilustran el acceso discreto, la barra desplegada y un panel adjunto con superficie Liquid Glass.</desc>
  <defs>
    <linearGradient id="bg" x2="0.9" y2="1"><stop stop-color="#242321"/><stop offset="1" stop-color="#111110"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".42"/><stop offset=".48" stop-color="#d9d0c5" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity=".27"/></linearGradient>
    <linearGradient id="light" x2="1"><stop stop-color="#d98e70"/><stop offset="1" stop-color="#e7c08d"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame1"><rect x="58" y="151" width="414" height="328" rx="22"/></clipPath>
    <clipPath id="frame2"><rect x="513" y="151" width="414" height="328" rx="22"/></clipPath>
    <clipPath id="frame3"><rect x="968" y="151" width="414" height="328" rx="22"/></clipPath>
  </defs>
  <rect width="1440" height="600" rx="32" fill="url(#bg)"/>
  <circle cx="1290" cy="90" r="155" fill="#b8795d" opacity=".13" filter="url(#blur)"/>
  <text x="68" y="74" fill="#d99b7a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">LIQUID GLASS · ACCESO LATERAL</text>
  <text x="68" y="117" fill="#f5f0e8" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600">Aparece cuando la necesitas.</text>

  <g filter="url(#shadow)">
    <rect x="58" y="151" width="414" height="328" rx="22" fill="#292826" stroke="#fff" stroke-opacity=".22"/>
    <g clip-path="url(#frame1)">
      <rect x="58" y="151" width="414" height="328" fill="#2c2a28"/>
      <path d="M60 360c99-150 166 125 278-25 47-63 93-68 134-31v176H58z" fill="#49433e"/>
      <path d="M60 390c119-75 177 69 278 0 50-35 88-46 134-25v122H58z" fill="#75614f" opacity=".65"/>
      <circle cx="451" cy="310" r="39" fill="url(#glass)" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/>
      <path d="M440 310h22m-9-9 9 9-9 9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="187" fill="#fff" fill-opacity=".75" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.4">ESCRITORIO · BARRA PLEGADA</text>
    </g>
    <rect x="513" y="151" width="414" height="328" rx="22" fill="#292826" stroke="#fff" stroke-opacity=".22"/>
    <g clip-path="url(#frame2)">
      <rect x="513" y="151" width="414" height="328" fill="#393531"/>
      <path d="M515 356c112-104 173 92 285-11 49-45 88-51 129-26v162H513z" fill="#51483e"/>
      <path d="M515 405c109-44 169 51 285 9 52-19 89-27 129-15v82H513z" fill="#907259" opacity=".7"/>
      <rect x="842" y="179" width="68" height="265" rx="33" fill="url(#glass)" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/>
      <circle cx="876" cy="218" r="14" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M876 210v8l5 3" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="876" cy="281" r="14" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M863 281h26m-13-13c5 7 5 19 0 26m0-26c-5 7-5 19 0 26" fill="none" stroke="#fff" stroke-width="1.1"/>
      <circle cx="876" cy="344" r="14" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M870 344h12m-6-6v12" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="876" cy="407" r="14" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M876 400l2 4 5 1-2 5 1 4-5 1-2 3-4-3-4 1-1-5-3-3 3-4-1-4 5-1z" fill="none" stroke="#fff" stroke-width="1"/>
      <text x="535" y="187" fill="#fff" fill-opacity=".75" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.4">AL ACERCAR EL CURSOR</text>
    </g>
    <rect x="968" y="151" width="414" height="328" rx="22" fill="#292826" stroke="#fff" stroke-opacity=".22"/>
    <g clip-path="url(#frame3)">
