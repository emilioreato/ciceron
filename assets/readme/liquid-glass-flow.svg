      <path d="M970 413c114-53 150 33 234 9 68-19 116-38 179-5v64H968z" fill="#aa7b5f" opacity=".7"/>
      <circle cx="1117" cy="304" r="53" fill="url(#glass)" stroke="#fff" stroke-opacity=".88" stroke-width="2"/>
      <circle cx="1117" cy="304" r="41" fill="#fff" fill-opacity=".09"/>
      <path d="M1088 293c18-34 54-40 79-14" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round"/>
      <path d="M1083 320c20 28 57 35 83 12" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>
      <rect x="1192" y="230" width="166" height="168" rx="20" fill="url(#glass)" stroke="#fff" stroke-opacity=".78" stroke-width="1.5"/>
      <text x="1210" y="264" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">Timer</text>
      <text x="1210" y="310" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="500">25:00</text>
      <rect x="1210" y="338" width="92" height="30" rx="15" fill="#fff" fill-opacity=".22"/><text x="1256" y="358" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">ENFOCAR</text>
      <text x="990" y="187" fill="#fff" fill-opacity=".75" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.4">ABRES UN PANEL</text>
