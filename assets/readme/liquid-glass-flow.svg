  <g fill="#f3eee6" font-family="Segoe UI,Arial,sans-serif">
    <text x="72" y="526" font-size="16" font-weight="650">01 · En reposo</text>
    <text x="72" y="553" fill="#aaa39a" font-size="14">La burbuja espera en el borde.</text>
    <text x="527" y="526" font-size="16" font-weight="650">02 · Se despliega</text>
    <text x="527" y="553" fill="#aaa39a" font-size="14">La barra muestra tus accesos.</text>
    <text x="982" y="526" font-size="16" font-weight="650">03 · Entras a la app</text>
    <text x="982" y="553" fill="#aaa39a" font-size="14">El panel acompaña el escritorio.</text>
  </g>
  <path d="M480 315h22m-8-8 8 8-8 8M935 315h22m-8-8 8 8-8 8" fill="none" stroke="url(#light)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
